[tools]
java = "25"
maven = "3.9.12"
python = "3.14"

[tasks.build]
description = "Build all modules (tests skipped)"
run = "mvn -B -ntp -DskipTests package"

[tasks.test]
description = "Run the tests of all modules (Testcontainers starts its own containers, no infra:up needed)"
run = "mvn -B -ntp verify"

[tasks."infra:up"]
description = "Start RabbitMQ, two Postgres databases and Toxiproxy, wait until healthy"
dir = "support"
run = "docker compose up -d --wait"

[tasks."infra:down"]
description = "Stop the infrastructure and drop its volumes"
dir = "support"
run = "docker compose down -v"

[tasks.scenario]
description = "Run one chaos scenario: after-commit+naive, in-transaction+naive, outbox+naive or outbox+inbox [--seed N]"
depends = ["build"]
raw = true  # keeps the terminal, so the status line redraws in place
run = "python3 support/chaos.py"

[tasks.demo]
description = "The whole story in one run: prologue, four chaos scenarios, final table (about 6 min)"
depends = ["build", "infra:up"]
raw = true  # with deps mise prefixes and pipes task output, which turns the TTY features off
run = "python3 support/chaos.py demo"
